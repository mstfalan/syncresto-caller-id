name: syncresto_caller_id
description: "SyncResto Caller ID — Restoran gelen arama yöneticisi"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # POS app pattern (network, state, storage)
  dio: ^5.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  socket_io_client: ^3.0.2
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.3
  crypto: ^3.0.3
  intl: ^0.19.0
  # Caller ID specific
  flutter_secure_storage: ^9.2.2
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cid/cid_x64.dll
    - assets/cid/cid_x86.dll
    - assets/images/logo.png
