name: syncresto_caller_id
description: "SyncResto Caller ID — Restoran gelen arama yöneticisi"
publish_to: 'none'
version: 0.3.1+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Ağ + durum + depolama (lib/'de gerçekten kullanılanlar)
  dio: ^5.9.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  path: ^1.9.1
  path_provider: ^2.1.5
  crypto: ^3.0.3            # DLL hash doğrulama (caller_id_service)
  intl: ^0.19.0            # tarih/saat formatı
  flutter_secure_storage: ^9.2.2  # integration key
  # 7 Tem 2026 (Fable): KULLANILMAYAN dependency'ler kaldırıldı (lib/'de 0 import) —
  # audioplayers_windows native plugin'i VS18'de <experimental/coroutine> deprecation
  # ile build'i KIRIYORDU. Kaldırılanlar: sqflite, sqflite_common_ffi, connectivity_plus,
  # socket_io_client, audioplayers, uuid, device_info_plus, package_info_plus, ffi
  # (v0.3 process mimarisinde FFI terk edildi). Gerekirse geri eklenir.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cid/cid_x64.dll
    - assets/cid/cid_x86.dll
    - assets/cid/SyncResto.CallerIdHelper.exe
    - assets/images/logo.png
    # Mozilla CA bundle — Windows boringssl sistem CA'yı kullanmaz (CERTIFICATE_VERIFY_FAILED fix)
    - assets/certs/cacert.pem
